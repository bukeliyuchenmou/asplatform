services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
        APT_MIRROR: ${APT_MIRROR:-mirrors.ustc.edu.cn}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: asplatform-app-dev
    ports:
      - "${APP_PORT:-8002}:8002"
    volumes:
      - .:/app
      - ./deploy/config.local-mysql.docker.yaml:/app/config.yaml:ro
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${OAUTH_DEV_HOST:-oauth.localhost}:host-gateway"
    restart: unless-stopped

  frontend:
    image: node:22-bookworm-slim
    container_name: asplatform-frontend-dev
    working_dir: /frontend
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_PROXY_TARGET: "http://app:8002"
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    command: >
      sh -c "corepack enable
      && yarn install
      && yarn dev --host 0.0.0.0 --port 5173"
    restart: unless-stopped

volumes:
  frontend_node_modules:
